<html>
    <div>
        <h1>Add Employee</h1>
        <form method="post" [formGroup]="employeeForm">
            <mat-form-field>
                <mat-label>Name</mat-label>
                <input matInput type="text" formControlName="name" required>
            </mat-form-field>
            <br>
            <br>
            <mat-form-field>
                <mat-label>Email</mat-label>
                <input matInput type="text" formControlName="email" required>
            </mat-form-field>
            <br>
            <br>
            <mat-form-field>
                <mat-label>Username</mat-label>
                <input matInput type="text"  formControlName="username" required>
            </mat-form-field>
            <br>
            <br>
            <mat-form-field>
                <mat-label>Password</mat-label>
                <input matInput type="password" formControlName="password" required>
            </mat-form-field>
            <br>
            <br>
            <mat-form-field>
                <mat-label>Position</mat-label>
                <input matInput type="text" formControlName="position" required>
            </mat-form-field>
            <br><br>
            <mat-form-field>
                <mat-label>Choose a rating: </mat-label>
                <mat-select>
                    <mat-option value="one">1</mat-option>
                    <mat-option value="two">2</mat-option>
                    <mat-option value="three">3</mat-option>
                    <mat-option value="four">4</mat-option>
                    <mat-option value="five">5</mat-option>
                    <mat-option value="six">6</mat-option>
                    <mat-option value="seven">7</mat-option>
                    <mat-option value="eight">8</mat-option>
                    <mat-option value="nine">9</mat-option>
                    <mat-option value="ten">10</mat-option>
                </mat-select>
            </mat-form-field>
            <br>
            <br>
            <mat-form-field>
                <mat-label>Salary</mat-label>
                <input matInput type="number" name="salary" formControlName="salary">
            </mat-form-field> 
            <br>
            <br>
            <button matButton (click)="onSubmit()" type="submit">Add Employee</button>
            <br><br>
        </form>
    </div>
</html>
