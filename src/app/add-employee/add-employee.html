<html>
    <div>
        <h1>Add Employee</h1>
        <form method="post" [formGroup]="employeeForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" formControlName="name" required>
            <br><br>
            <label for="name">Email:</label>
            <input type="text" id="email" name="email" formControlName="email" required>
            <br><br>
            <label for="username">Username:</label>
            <input type="hidden" id="id" name="id" formControlName="id" required>
            <input type="text" id="username" name="username" formControlName="username" required>
            <br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" formControlName="password" required>
            <br><br>
            <label for="position">Position:</label>
            <input type="text" id="position" name="position" formControlName="position" required>
            <br><br>
            <label for="rating">Rating:</label>
            <input type="number" id="rating" name="rating" formControlName="rating" [min]="5" [max]="10" required>
            <br><br>
            <label for="salary">Salary:</label>
            <input type="number" id="salary" name="salary" formControlName="salary" required>
            <br><br>
            <button id="{{ACTION_Local.GO_ADD}}" (click)="go($event)" type="submit">Add Employee</button>
            <br><br>
        </form>
    </div>
</html>
