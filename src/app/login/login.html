<div>
    <h1 style="margin-left:21%">Login Page</h1>
    <br>
    <br>
    <form method="post" [formGroup]="loginForm">
        <mat-form-field style="margin-left: 19%;">
            <mat-label>UserName</mat-label>
            <input matInput type="text" formControlName="username" >
        </mat-form-field>
        <br>
        <br>
        <mat-form-field style="margin-left: 19%;">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password">
        </mat-form-field>
        <br>
        <br>

        <button style="margin-left: 25%;" matButton id="{{ACTION_Local.SUBMIT_LOGIN}}" (click)="submit($event)" type="submit">Login</button>
    </form>
</div>
