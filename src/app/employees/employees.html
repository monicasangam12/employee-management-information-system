<html>
    <div>
        <h1>Employees Details List</h1>
    </div>
    <article class="table-header">
        <mat-button-toggle-group #employeeGroup="matButtonToggleGroup" (change)="onToggleChange()" style="margin-left: 19%;">
            <mat-button-toggle style="color: aqua;" class="button-view-add" mat-button-toggle value="viewAdd" (click)="go($event)" checked>Add Row</mat-button-toggle>
            <mat-button-toggle style="color: bisque;" class="button-view-editable" mat-button-toggle value="viewEditable" (click)="go($event)">Edit Row</mat-button-toggle>
            <mat-button-toggle style="color: lightcoral;" class="button-view-deletable" mat-button-toggle value="viewDeletable" (click)="go($event)">Delete Row</mat-button-toggle>
            <mat-button-toggle style="color: lightseagreen;" class="button-view-searchable" mat-button-toggle value="viewSearchable" (click)="go($event)">Search Row</mat-button-toggle>
        </mat-button-toggle-group>
        <button class="button-add-row" mat-button (click)="go($event)" id="{{ACTION_Local.GO_ADD}}">Add Row</button>
        <button class="button-edit-row" mat-button (click)="go($event)" id="{{ACTION_Local.GO_EDIT}}">Edit Row</button>
        <button class="button-delete-row" mat-button (click)="go($event)" id="{{ACTION_Local.GO_DELETE}}">Delete Row</button>
        <button class="button-search-row" mat-button (click)="go($event)" id="{{ACTION_Local.GO_SEARCH}}">Search Row</button>
    </article>
    <mat-form-field style="margin-left: 66%;">
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. John" #input>
    </mat-form-field>
   <table mat-table [dataSource]="dataSource" matSort>
        <ng-container [matColumnDef]="col" *ngFor="let col of displayedColumns;index as i">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
            <span *ngIf="columnsSchema[i].key != 'id'">
                {{col}}
            </span>
        </th>
        <td mat-cell *matCellDef="let element">
            <div *ngIf="columnsSchema[i].key == 'isEdit'">
                <input type="checkbox" [checked]="element[col]"  (click)="checkedOrUnchecked(element)" />
            </div>
            <div *ngIf="columnsSchema[i].key != 'id' && columnsSchema[i].key != 'isEdit'">
                {{element[col]}}
            </div>
        </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</html>
